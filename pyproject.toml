[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbml-viewer"
version = "0.2.0"
description = "Generate interactive HTML ER diagrams from DBML files"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Justin Smethers", email = "48101971+JustinSmethers@users.noreply.github.com" },
]
keywords = [
    "dbml",
    "erd",
    "diagram",
    "database",
    "schema",
    "visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
dependencies = [
    "jinja2>=3.1.0",
    "pydbml>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
dbml-viewer = "dbml_viewer.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dbml_viewer = ["templates/*.j2", "templates/*.js", "templates/*.css"]
